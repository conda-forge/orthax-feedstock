schema_version: 1

context:
  version: "0.2.10"
  python_min: "3.10"

package:
  name: "orthax"
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/orthax/orthax-${{ version }}.tar.gz
  sha256: 71079de617d1a13040e1bf68666f8f5ba4c9a35f515b811e7b6a051a53580f8e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.0
    - versioneer >=0.29
    # versioneer[toml] on python < 3.11
    - tomli
    - pip
  run:
    - python >=${{ python_min }}
    - equinox >=0.11.0,<0.14
    - jax >=0.5.0,<0.12
    - numpy >=1.25.0,<2.6

tests:
  - python:
      imports:
        - orthax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Orthogonal polynomials with JAX
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/f0uriest/orthax
  repository: https://github.com/f0uriest/orthax
  documentation: https://orthax.readthedocs.io/

extra:
  recipe-maintainers:
    - matthewfeickert
