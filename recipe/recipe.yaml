schema_version: 1

context:
  version: "0.2.11"
  python_min: "3.11"

package:
  name: "orthax"
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/orthax/orthax-${{ version }}.tar.gz
  sha256: dcbb33b3908afed59575f205893d436ae5ac7fae23165fb14d8b988ec4531e08

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0.0
    - versioneer >=0.29
    - pip
  run:
    - python >=${{ python_min }}
    - equinox >=0.11.0,<0.14
    - jax >=0.5.0,<0.13
    - numpy >=1.25.0,<2.6

tests:
  - python:
      imports:
        - orthax
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Orthogonal polynomials with JAX
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/f0uriest/orthax
  repository: https://github.com/f0uriest/orthax
  documentation: https://orthax.readthedocs.io/

extra:
  recipe-maintainers:
    - matthewfeickert
